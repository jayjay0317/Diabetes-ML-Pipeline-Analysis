version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.flask
    ports:
      - "5000:5000"
    volumes:
      - ./src:/app/src
      - ./notebooks:/app/notebooks
    environment:
      - FLASK_ENV=development # Enable debug mode for hot-reloading

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    ports:
      - "8501:8501"
    volumes:
      - ./src:/app/src
    depends_on:
      - backend
    environment:
      - API_URL=http://backend:5000 # Internal Docker network routing